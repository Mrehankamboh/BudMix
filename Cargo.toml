[workspace]
resolver = "3"
members = [
    "crates/budslink-core",
    "crates/budslink-win",
    "crates/budslink-miracast",
    "apps/desktop/src-tauri",
]
# The desktop app needs a webview toolchain; plain `cargo test` covers the libraries.
default-members = [
    "crates/budslink-core",
    "crates/budslink-win",
    "crates/budslink-miracast",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
budslink-core = { path = "crates/budslink-core" }
budslink-win = { path = "crates/budslink-win" }
budslink-miracast = { path = "crates/budslink-miracast" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
