[package]
name = "budslink-miracast"
description = "Miracast receiver for BudsLink: lets an Android phone cast to the laptop so its audio plays in the buds."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
log.workspace = true

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "ApplicationModel_Core",
    "Devices_Enumeration",
    "Foundation",
    "Media_Core",
    "Media_Miracast",
    "Media_Playback",
    "Win32_Foundation",
    "Win32_System_Com",
] }
