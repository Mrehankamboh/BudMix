[package]
name = "budslink-miracast"
description = "Miracast receiver for BudsLink: lets an Android phone cast to the laptop so its audio plays in the buds."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
budslink-core.workspace = true
log.workspace = true

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows-numerics = "0.3"
windows = { version = "0.62", features = [
    "ApplicationModel_Core",
    "Devices_Enumeration",
    "Foundation",
    "Media_Core",
    "Media_Miracast",
    "Media_Playback",
    "System",
    "UI_Composition",
    "UI_Composition_Desktop",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_NetworkListManager",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_UI_WindowsAndMessaging",
] }
